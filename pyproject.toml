[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-rescue"
version = "0.1.0"
description = "Consent-based backup & recovery toolkit for a phone you own (iPhone/Android)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pymobiledevice3>=4.0",
    "pillow>=10.0",
    "texture2ddecoder>=1.0",
]

[project.scripts]
phonerescue = "phonerescue.cli:main"

[tool.setuptools.packages.find]
include = ["phonerescue*"]
